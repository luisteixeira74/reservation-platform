apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: reservation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: laravel
          image: ghcr.io/luisteixeira74/reservation-platform-app:35d6aaeb0049fcdb4cb3632bd7391b8f61b2d0e1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: reservation-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: reservation-secret
                  key: APP_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reservation-secret
                  key: DB_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: reservation
spec:
  selector:
    app: app
  ports:
    - port: 9000
      targetPort: 9000
