apiVersion: v1
kind: ConfigMap
metadata:
  name: reservation-config
  namespace: reservation
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://localhost:8081"

  DB_CONNECTION: "pgsql"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_DATABASE: "reservation"
  DB_USERNAME: "reservation"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  SESSION_DRIVER: "database"
  CACHE_STORE: "database"
  QUEUE_CONNECTION: "redis"
