apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: reservation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: ghcr.io/luisteixeira74/reservation-platform-nginx:35d6aaeb0049fcdb4cb3632bd7391b8f61b2d0e1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: reservation
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
