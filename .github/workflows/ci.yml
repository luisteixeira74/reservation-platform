name: CI and Publish Images

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        name: Laravel Tests
        runs-on: ubuntu-latest

        env:
            APP_ENV: testing
            APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  extensions: pdo_sqlite, pdo_pgsql, bcmath, pcntl, zip
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Prepare Laravel
              run: php artisan package:discover --ansi

            - name: Run tests
              run: php artisan test

    publish:
        name: Build and Publish Images
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and publish Laravel image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  tags: ghcr.io/luisteixeira74/reservation-platform-app:${{ github.sha }}

            - name: Build and publish Nginx image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/nginx/Dockerfile
                  push: true
                  tags: ghcr.io/luisteixeira74/reservation-platform-nginx:${{ github.sha }}
